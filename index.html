<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قانون نيوتن الثالث - AR</title>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
  #hint,#info{position:fixed;left:12px;right:12px;z-index:10;text-align:center;color:#fff;
    background:rgba(15,23,42,.82);border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.6}
  #hint{top:12px}
  #info{bottom:12px;display:none}
  #info b{color:#fbbf24}
  #stop{position:fixed;top:70px;left:12px;z-index:10;border:0;border-radius:10px;padding:8px 14px;
    background:#ef4444;color:#fff;font-size:14px;display:none}
</style>
</head>
<body>
<div id="hint">وجّه الكاميرا على الصورة، ثم المس الكرة اليمنى أو اليسرى</div>
<button id="stop">إيقاف</button>
<div id="info"></div>

<script>
// ===== المكوّن: بندول نيوتن =====
AFRAME.registerComponent('cradle', {
  init() {
    this.A = 38;            // أقصى زاوية (درجة)
    this.P = 0.9;           // نصف زمن الدورة (ثانية)
    this.running = false;
    this.t0 = 0;
    this.last = '';
    this.pivots = [0,1,2,3,4].map(i => this.el.querySelector('#p' + i));
    const start = side => {
      this.running = true;
      this.t0 = performance.now() / 1000 - (side === 'left' ? 0 : this.P);
    };
    this.el.querySelector('#b0').addEventListener('click', () => start('left'));
    this.el.querySelector('#b4').addEventListener('click', () => start('right'));
    document.getElementById('stop').onclick = () => { this.running = false; this.reset(); };
  },
  reset() {
    this.pivots.forEach(p => p.setAttribute('rotation', '0 0 0'));
    this.say('');
  },
  say(html) {
    if (html === this.last) return;
    this.last = html;
    const el = document.getElementById('info');
    el.style.display = html ? 'block' : 'none';
    el.innerHTML = html;
    document.getElementById('stop').style.display = html ? 'block' : 'none';
  },
  tick() {
    if (!this.running) return;
    const now = performance.now() / 1000 - this.t0;
    const w = Math.PI / this.P;
    const u = now % (2 * this.P);
    const v = -this.A * Math.cos(w * u);
    this.reset_angles = 1;
    this.pivots.forEach(p => p.object3D.rotation.z = 0);
    if (v < 0) this.pivots[0].object3D.rotation.z = THREE.MathUtils.degToRad(v);
    else this.pivots[4].object3D.rotation.z = THREE.MathUtils.degToRad(v);

    // نصوص الشرح حسب مرحلة الحركة
    const near = x => Math.abs(u - x) < 0.12;
    if (near(this.P / 2) || near(1.5 * this.P)) {
      this.say('💥 <b>لحظة التصادم:</b> الكرة تدفع جارتها بقوة (الفعل)، والجارة تدفعها بقوة <b>مساوية ومعاكسة</b> (ردة الفعل)');
    } else if (u < this.P / 2 || u > 1.5 * this.P) {
      this.say('الكرة اليسرى تتحرك نحو الكرات الأخرى وتنقل لها الزخم');
    } else {
      this.say('انتقل الزخم عبر الكرات الوسطى، فارتفعت الكرة الأخيرة بنفس المقدار');
    }
  }
});
</script>

<script>
// ===== بناء المشهد =====
const preview = new URLSearchParams(location.search).has('preview');

const balls = [0,1,2,3,4].map(i => `
  <a-entity id="p${i}" position="${(i-2)*0.2} 0.7 0">
    <a-sphere id="b${i}" class="clickable" radius="0.1" position="0 -0.4 0"
      material="color:#d4d8de; metalness:0.9; roughness:0.15"></a-sphere>
    <a-cylinder radius="0.003" height="0.4" position="0 -0.2 0" color="#999"></a-cylinder>
  </a-entity>`).join('');

const frame = `
  <a-box position="0 0.7 0" width="1.2" height="0.025" depth="0.025" color="#b8bec7" material="metalness:.8;roughness:.3"></a-box>
  <a-box position="-0.6 0.35 0" width="0.025" height="0.7" depth="0.025" color="#b8bec7"></a-box>
  <a-box position="0.6 0.35 0" width="0.025" height="0.7" depth="0.025" color="#b8bec7"></a-box>
  <a-box position="0 0 0" width="1.3" height="0.02" depth="0.5" color="#c8a26b"></a-box>`;

const cradle = `<a-entity cradle position="0 -0.25 0.25">${frame}${balls}</a-entity>`;
const lights = `<a-light type="ambient" intensity="1.1"></a-light>
  <a-light type="directional" position="1 2 2" intensity="1.4"></a-light>`;

let scene;
if (preview) {
  document.getElementById('hint').textContent = 'وضع المعاينة (بدون كاميرا): المس الكرة اليمنى أو اليسرى';
  scene = `<a-scene embedded vr-mode-ui="enabled:false" renderer="colorManagement:true" background="color:#e8eef5"
      cursor="rayOrigin:mouse" raycaster="objects:.clickable" style="position:fixed;inset:0">
      <a-camera position="0 0.2 1.9" look-controls="enabled:false" wasd-controls="enabled:false"></a-camera>
      ${lights}${cradle}</a-scene>`;
} else {
  scene = `<a-scene mindar-image="imageTargetSrc: ./targets.mind; uiScanning:yes; uiLoading:yes; filterMinCF:0.0001; filterBeta:0.001"
      color-space="sRGB" renderer="colorManagement:true; physicallyCorrectLights:true" vr-mode-ui="enabled:false"
      device-orientation-permission-ui="enabled:false" cursor="rayOrigin:mouse;fuse:false" raycaster="objects:.clickable">
      <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
      ${lights}
      <a-entity mindar-image-target="targetIndex:0" id="target">${cradle}</a-entity>
    </a-scene>`;
}
document.body.insertAdjacentHTML('beforeend', scene);

if (!preview) {
  document.addEventListener('DOMContentLoaded', () => {});
  window.addEventListener('load', () => {
    const t = document.getElementById('target');
    t.addEventListener('targetFound', () => document.getElementById('hint').textContent = 'المس الكرة اليمنى أو اليسرى لتبدأ التجربة 👆');
    t.addEventListener('targetLost', () => document.getElementById('hint').textContent = 'وجّه الكاميرا على الصورة');
  });
}
</script>
</body>
</html>
